<title>CP422 Midterm Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one working column under a sticky bar; the three MapReduce phase colours
   (map teal, shuffle amber, reduce violet) carry meaning through traces, levels and progress. */
:root {
  --paper: #EEF1F4;
  --panel: #FFFFFF;
  --sunk: #E3E8ED;
  --ink: #15202B;
  --ink-2: #4B5967;
  --line: #CFD7DF;
  --accent: #9A5300;
  --accent-bg: #FBE9D0;
  --map: #087068;
  --map-bg: #D9F0EC;
  --shuffle: #9A5300;
  --shuffle-bg: #FBE9D0;
  --reduce: #5F3DAE;
  --reduce-bg: #EAE3FA;
  --good: #19703F;
  --good-bg: #DDF2E5;
  --bad: #AE2A20;
  --bad-bg: #FBE2DF;
  --code-bg: #F6F8FA;
  --code-ink: #18232E;
  --c-kw: #8A2E9E;
  --c-str: #0F6E3B;
  --c-num: #9A5300;
  --c-com: #67727E;
  --c-fn: #0B5A9C;
  --c-type: #087068;
  --shadow: 0 1px 2px rgba(21, 32, 43, .06), 0 4px 16px rgba(21, 32, 43, .06);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E141A; --panel: #151D25; --sunk: #1C2630; --ink: #E3E9EF; --ink-2: #9AA8B6; --line: #2B3743;
    --accent: #F2A851; --accent-bg: #3A2915; --map: #52C9BF; --map-bg: #10302D; --shuffle: #F2A851; --shuffle-bg: #3A2915;
    --reduce: #B79DF5; --reduce-bg: #282042; --good: #63D394; --good-bg: #123020; --bad: #FF8E84; --bad-bg: #3B1A17;
    --code-bg: #10181F; --code-ink: #DCE4EC; --c-kw: #D69CF2; --c-str: #8BD9A8; --c-num: #F2B76E; --c-com: #7F8C99;
    --c-fn: #88BDF5; --c-type: #6ED3C9; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E141A; --panel: #151D25; --sunk: #1C2630; --ink: #E3E9EF; --ink-2: #9AA8B6; --line: #2B3743;
  --accent: #F2A851; --accent-bg: #3A2915; --map: #52C9BF; --map-bg: #10302D; --shuffle: #F2A851; --shuffle-bg: #3A2915;
  --reduce: #B79DF5; --reduce-bg: #282042; --good: #63D394; --good-bg: #123020; --bad: #FF8E84; --bad-bg: #3B1A17;
  --code-bg: #10181F; --code-ink: #DCE4EC; --c-kw: #D69CF2; --c-str: #8BD9A8; --c-num: #F2B76E; --c-com: #7F8C99;
  --c-fn: #88BDF5; --c-type: #6ED3C9; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel);
}
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 112%; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: inherit; }
code, kbd { font-family: var(--f-mono); font-size: .88em; }
code, kbd, pre, textarea.editor, input.blank, .pline { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
:not(pre) > code { background: var(--sunk); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--f-display); font-stretch: 100%; text-transform: uppercase; letter-spacing: .08em; font-size: .74rem; font-weight: 700; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.topbar-inner, main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-row { display: flex; align-items: center; gap: 12px; padding-block: 10px 4px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-stretch: 118%; font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; display: flex; gap: .45em; align-items: baseline; }
.brand span { color: var(--ink-2); font-weight: 600; font-stretch: 100%; }
.brand-mark { display: inline-flex; gap: 3px; align-self: center; }
.brand-mark i { width: 7px; height: 14px; border-radius: 2px; display: block; }
.brand-mark i:nth-child(1) { background: var(--map); }
.brand-mark i:nth-child(2) { background: var(--shuffle); }
.brand-mark i:nth-child(3) { background: var(--reduce); }
.topbar-meta { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill.count { background: var(--accent-bg); color: var(--accent); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); }
.pill.ai-ready .dot { background: var(--good); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 9px 12px 10px; cursor: pointer; white-space: nowrap;
  font-weight: 700; color: var(--ink-2); border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0;
}
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-weight: 400; font-size: .8em; color: var(--ink-2); margin-left: 4px; }

main { padding-block: 22px 64px; display: grid; gap: 18px; }
main > * { min-width: 0; }

/* ---------- building blocks ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > * + * { margin-top: 12px; }
.grid { display: grid; gap: 16px; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.grid-4 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  font-weight: 700; display: inline-flex; gap: 6px; align-items: center; min-height: 40px; text-decoration: none;
}
.btn:hover { background: var(--sunk); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.accent { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: .88rem; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 700; font-size: .88rem; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.tag.map { background: var(--map-bg); color: var(--map); }
.tag.shuffle { background: var(--shuffle-bg); color: var(--shuffle); }
.tag.reduce { background: var(--reduce-bg); color: var(--reduce); }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.note { border-radius: 8px; padding: 10px 12px; background: var(--sunk); font-size: .93rem; }
.note.good { background: var(--good-bg); }
.note.bad { background: var(--bad-bg); }
.note.warn { background: var(--accent-bg); }
.meter { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--map); border-radius: 99px; }
.empty { color: var(--ink-2); font-style: italic; }
ul.clean, ol.clean { list-style: none; padding: 0; margin: 0; }
.prose ul { padding-left: 1.2em; margin: 6px 0 0; }
.prose li + li { margin-top: 6px; }
details > summary { cursor: pointer; font-weight: 700; }

/* ---------- plan ---------- */
.hero { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: end; }
.hero .when { margin-top: 8px; color: var(--ink-2); }
.countdown { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.countdown small { font-size: .38em; font-stretch: 100%; font-weight: 700; color: var(--ink-2); letter-spacing: 0; margin-left: .3em; }
.blueprint { display: flex; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.blueprint > div { display: flex; flex-direction: column; justify-content: center; padding: 4px 8px; min-width: 0; font-size: .78rem; line-height: 1.2; }
.blueprint b { font-family: var(--f-display); font-size: 1rem; }
.blueprint .mcq { flex: 20; background: var(--map-bg); color: var(--map); }
.blueprint .tf { flex: 20; background: var(--sunk); color: var(--ink-2); }
.blueprint .code { flex: 40; background: var(--shuffle-bg); color: var(--shuffle); }
.blueprint .sa { flex: 20; background: var(--reduce-bg); color: var(--reduce); }
.blueprint span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flags li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.flags li:first-child { border-top: 0; }
.flags .when { font-family: var(--f-mono); font-size: .75rem; color: var(--ink-2); padding-top: 3px; white-space: nowrap; }
.flags .go { grid-column: 2; justify-self: start; font-size: .85rem; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); }
.checklist li:first-child { border-top: 0; }
.checklist input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--map); flex: none; }
.checklist .day { font-size: .75rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; display: block; }
.checklist input:checked + div { color: var(--ink-2); text-decoration: line-through; }
.mastery { display: grid; gap: 10px; }
.mastery-row { display: grid; grid-template-columns: minmax(0, 190px) 1fr auto; gap: 12px; align-items: center; font-size: .92rem; }
.mastery-row .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .85rem; white-space: nowrap; }
@media (max-width: 520px) { .mastery-row { grid-template-columns: 1fr auto; } .mastery-row .meter { grid-column: 1 / -1; grid-row: 2; } }

/* ---------- notes ---------- */
.note-section h3 { margin-bottom: 6px; }
.note-section + .note-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--sunk); font-family: var(--f-display); font-stretch: 105%; font-weight: 700; }
tbody th { background: transparent; color: var(--ink-2); font-family: var(--f-body); font-stretch: 100%; white-space: nowrap; }
tr:last-child td, tr:last-child th { border-bottom: 0; }
.search { width: 100%; max-width: 420px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
mark { background: var(--accent-bg); color: inherit; border-radius: 3px; }

/* ---------- questions ---------- */
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qtext { font-size: 1.12rem; font-weight: 700; line-height: 1.45; }
.options { display: grid; gap: 8px; }
.opt {
  text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 9px; padding: 11px 14px; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--ink-2); }
.opt .key { font-family: var(--f-mono); font-weight: 600; font-size: .8rem; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: var(--sunk); color: var(--ink-2); }
.opt.picked { border-color: var(--ink); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf-row .opt { grid-template-columns: auto 1fr; font-weight: 700; }
.progress-top { display: flex; gap: 12px; align-items: center; }
.progress-top .meter { flex: 1; }
.src { font-size: .8rem; color: var(--ink-2); }
.result-big { font-family: var(--f-display); font-stretch: 120%; font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- code ---------- */
pre.code {
  margin: 0; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto; font: 13.5px/1.55 var(--f-mono); tab-size: 4;
}
pre.code.data { font-size: 12.5px; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--c-kw); }
.hljs-string { color: var(--c-str); }
.hljs-number { color: var(--c-num); }
.hljs-comment, .hljs-meta { color: var(--c-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--c-fn); }
.hljs-type, .hljs-title.class_ { color: var(--c-type); }
.hljs-params, .hljs-variable { color: inherit; }
input.blank {
  font: 600 13.5px/1.3 var(--f-mono); border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-bg); color: var(--code-ink);
  padding: 0 3px; border-radius: 3px 3px 0 0; min-width: 2.5ch;
}
input.blank.ok { border-color: var(--good); background: var(--good-bg); }
input.blank.no { border-color: var(--bad); background: var(--bad-bg); }
.tracks .track { text-align: left; cursor: pointer; display: grid; gap: 10px; align-content: start; }
.tracks .track:hover { border-color: var(--ink-2); }
.tracks .track[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow); }
.ladder { display: flex; gap: 4px; }
.ladder i { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); }
.ladder i.part { background: var(--shuffle); }
.ladder i.full { background: var(--map); }
.lvl { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; font: 700 .8rem var(--f-mono); background: var(--sunk); color: var(--ink-2); }
.lvl.l1 { background: var(--map-bg); color: var(--map); }
.lvl.l2 { background: var(--map-bg); color: var(--map); }
.lvl.l3 { background: var(--shuffle-bg); color: var(--shuffle); }
.lvl.l4 { background: var(--reduce-bg); color: var(--reduce); }
.lvl.l5 { background: var(--ink); color: var(--paper); }
.exlist li { border-top: 1px solid var(--line); }
.exlist li:first-child { border-top: 0; }
.exlist button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; border-radius: 6px; }
.exlist button:hover { background: var(--sunk); }
.level-head { margin-top: 14px; display: flex; gap: 10px; align-items: baseline; }
.level-head:first-child { margin-top: 0; }
.status { font-size: .8rem; font-weight: 700; white-space: nowrap; }
.status.done { color: var(--good); }
.editor {
  width: 100%; min-height: 280px; resize: vertical; font: 13.5px/1.55 var(--f-mono); tab-size: 4; padding: 12px 14px;
  background: var(--code-bg); color: var(--code-ink); border: 1.5px solid var(--line); border-radius: 8px; white-space: pre; overflow-wrap: normal; overflow-x: auto;
}
.editor:focus { border-color: var(--ink-2); }
.parsons { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); align-items: start; }
.parsons-col { display: grid; gap: 6px; align-content: start; min-height: 80px; padding: 10px; border-radius: 8px; background: var(--sunk); min-width: 0; }
.parsons-col.answer { background: var(--code-bg); border: 1.5px dashed var(--line); }
.pline {
  text-align: left; font: 13px/1.45 var(--f-mono); padding: 7px 10px; border-radius: 6px; width: 100%;
  border: 1px solid var(--line); background: var(--panel); color: var(--code-ink); cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline;
}
.pline .pc { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.pline.pool { grid-template-columns: minmax(0, 1fr); }
.pline:hover { border-color: var(--ink-2); }
.pline .ln { color: var(--ink-2); font-size: .75rem; min-width: 1.6em; text-align: right; flex: none; }
.pline.ok { border-color: var(--good); }
.pline.no { border-color: var(--bad); background: var(--bad-bg); }
.trace { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 0; overflow-x: auto; padding-bottom: 4px; }
.trace .phase { padding: 10px; border-radius: 8px; display: grid; gap: 5px; align-content: start; position: relative; margin-right: 18px; }
.trace .phase:not(:last-child)::after { content: "→"; position: absolute; right: -15px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-weight: 700; }
.trace .phase h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; font-stretch: 100%; }
.trace .phase div { font: 12px/1.4 var(--f-mono); background: var(--panel); border-radius: 5px; padding: 4px 6px; overflow-wrap: anywhere; }
.trace .input { background: var(--sunk); color: var(--ink-2); }
.trace .map, .trace .rdd { background: var(--map-bg); color: var(--map); }
.trace .shuffle { background: var(--shuffle-bg); color: var(--shuffle); }
.trace .reduce { background: var(--reduce-bg); color: var(--reduce); }
.trace .output { background: var(--good-bg); color: var(--good); }
.trace .phase div { color: var(--code-ink); }
.checks li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.checks .mark { font-weight: 800; width: 1.2em; flex: none; }
.checks .y { color: var(--good); }
.checks .n { color: var(--bad); }
.rubric li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
.rubric li:first-child { border-top: 0; }
.rubric input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--map); flex: none; }
.rubric .pts { margin-left: auto; font: 600 .8rem var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.ai-box { border: 1.5px solid var(--reduce); border-radius: 9px; padding: 14px; background: var(--reduce-bg); }
.ai-box .score { font-family: var(--f-display); font-stretch: 120%; font-weight: 800; font-size: 2rem; line-height: 1; color: var(--reduce); }
.ai-box table td { background: var(--panel); }
.ai-only { display: none !important; }
body.ai-on .ai-only { display: inline-flex !important; }
body.ai-on details.ai-only, body.ai-on div.ai-only { display: block !important; }
body.ai-on li.ai-only { display: list-item !important; }
.ask { border-top: 1px dashed var(--line); padding-top: 10px; }
.ask textarea { width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-top: 8px; resize: vertical; }
.answer-text { white-space: pre-wrap; margin-top: 8px; }
.sa-area { width: 100%; min-height: 200px; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--panel); resize: vertical; line-height: 1.55; }
